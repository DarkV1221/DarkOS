name: DarkOS ISO

on:
  push:
    branches:
      - main
      - darkos-1.0-desktop
    paths:
      - ".github/workflows/iso.yml"
      - "recipes/**"
      - "files/**"
      - "modules/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: Build DarkOS 1.0 offline installer ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out DarkOS
        uses: actions/checkout@v4

      - name: Install pinned BlueBuild CLI
        shell: bash
        run: |
          curl --fail --show-error --silent --location \
            https://raw.githubusercontent.com/blue-build/cli/v0.9.41/install.sh \
            --output /tmp/install-bluebuild.sh
          bash /tmp/install-bluebuild.sh
          bluebuild --version

      - name: Build the x86_64 installer ISO
        shell: bash
        run: |
          sudo bluebuild generate-iso \
            --variant silverblue \
            --iso-name DarkOS-1.0-x86_64.iso \
            recipe recipes/recipe.yml

      - name: Verify ISO and create SHA-256 checksum
        shell: bash
        run: |
          test -s DarkOS-1.0-x86_64.iso
          file DarkOS-1.0-x86_64.iso
          sha256sum DarkOS-1.0-x86_64.iso > DarkOS-1.0-x86_64.iso.sha256
          cat DarkOS-1.0-x86_64.iso.sha256

      - name: Split ISO into download-sized pieces
        shell: bash
        run: |
          mkdir -p iso-pieces
          split --bytes=400000000 --numeric-suffixes=0 --suffix-length=2 \\
            DarkOS-1.0-x86_64.iso iso-pieces/DarkOS-1.0-x86_64.iso.
          ls -lh iso-pieces/
          test "$(find iso-pieces -maxdepth 1 -type f | wc -l)" -eq 13

      - name: Upload ISO piece 00
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-00
          path: iso-pieces/DarkOS-1.0-x86_64.iso.00
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 01
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-01
          path: iso-pieces/DarkOS-1.0-x86_64.iso.01
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 02
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-02
          path: iso-pieces/DarkOS-1.0-x86_64.iso.02
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 03
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-03
          path: iso-pieces/DarkOS-1.0-x86_64.iso.03
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 04
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-04
          path: iso-pieces/DarkOS-1.0-x86_64.iso.04
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 05
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-05
          path: iso-pieces/DarkOS-1.0-x86_64.iso.05
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 06
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-06
          path: iso-pieces/DarkOS-1.0-x86_64.iso.06
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 07
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-07
          path: iso-pieces/DarkOS-1.0-x86_64.iso.07
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 08
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-08
          path: iso-pieces/DarkOS-1.0-x86_64.iso.08
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 09
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-09
          path: iso-pieces/DarkOS-1.0-x86_64.iso.09
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 10
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-10
          path: iso-pieces/DarkOS-1.0-x86_64.iso.10
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 11
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-11
          path: iso-pieces/DarkOS-1.0-x86_64.iso.11
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO piece 12
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-piece-12
          path: iso-pieces/DarkOS-1.0-x86_64.iso.12
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload ISO SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-1.0-ISO-checksum
          path: DarkOS-1.0-x86_64.iso.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
