name: DarkOS Arch ISO

on:
  push:
    branches:
      - arch-port
    paths:
      - "archiso/**"
      - ".github/workflows/arch-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arch-iso:
    name: Build DarkOS Arch development ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso git

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ISO with archiso
        run: |
          mkdir -p out
          mkarchiso -v -w /tmp/darkos-work -o out archiso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-Arch-x86_64-development
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
