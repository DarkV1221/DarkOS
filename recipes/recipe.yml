---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: darkos
description: DarkOS 1.0 — a Fedora Atomic desktop with the DarkOS full-screen shell.

# Keep the Universal Blue Silverblue base so DarkOS retains its GNOME session,
# hardware support, and Atomic update model.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  # Install the DarkOS shell, Bash configuration, and GNOME autostart entry.
  - type: files
    files:
      - source: system
        destination: /

  # Desktop shell dependencies. VTE embeds a real Bash terminal in DarkShell.
  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - python3-gobject
        - vte291-gtk4
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # Install the four requested apps for every user through the system Flathub
  # remote. The module completes this setup during first boot.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - com.valvesoftware.Steam
          - org.prismlauncher.PrismLauncher
          - io.github.kolunmi.Bazaar
          - org.gnome.Loupe
      - scope: user

  # Installs the cosign verification policy used by Atomic systems.
  - type: signing
