name: DarkOS Arch ISO

on:
  push:
    branches:
      - main
      - arch-port
    paths:
      - "archiso/**"
      - ".github/workflows/arch-iso.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arch-iso:
    name: Build DarkOS Arch development ISO
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and validate ISO in a privileged Arch container
        run: |
          docker run --privileged --rm \
            --volume "${GITHUB_WORKSPACE}:/work" \
            --workdir /work \
            archlinux:latest \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed archiso git python
              python3 -m py_compile archiso/airootfs/usr/share/darkos-shell/darkos-shell.py
              bash -n archiso/airootfs/usr/share/darkos-shell/darkos.bash
              bash -n archiso/airootfs/root/customize_airootfs.sh
              chmod +x archiso/airootfs/root/customize_airootfs.sh
              mkdir -p out
              mkarchiso -v -w /tmp/darkos-work -o /work/out /work/archiso
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: DarkOS-Arch-x86_64-development
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
